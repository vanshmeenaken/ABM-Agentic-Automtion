version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ken_abm_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ken_abm}
      POSTGRES_USER: ${POSTGRES_USER:-ken_abm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ken_abm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ken_abm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ken_abm_django
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=${POSTGRES_DB:-ken_abm}
      - POSTGRES_USER=${POSTGRES_USER:-ken_abm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localpassword}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ken_abm_celery_worker
    command: celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=${POSTGRES_DB:-ken_abm}
      - POSTGRES_USER=${POSTGRES_USER:-ken_abm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localpassword}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - django-api

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ken_abm_celery_beat
    command: celery -A config beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=${POSTGRES_DB:-ken_abm}
      - POSTGRES_USER=${POSTGRES_USER:-ken_abm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localpassword}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - django-api

volumes:
  postgres_data:
